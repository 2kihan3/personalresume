<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Studio - 主页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            background: #0a0a0a;
        }
        
        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2a 50%, #0a0a0a 100%);
        }
        
        .matte-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(26,10,42,0.3) 0%, rgba(10,10,10,0.6) 100%);
            pointer-events: none;
        }
        
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.08) 2px,
                rgba(0, 0, 0, 0.08) 4px
            );
            pointer-events: none;
            opacity: 0.4;
        }
        
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
        }
        
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
        }
        
        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ff6b35 0%, transparent 70%);
            top: -150px;
            left: -100px;
        }
        
        .orb-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #39ff14 0%, transparent 70%);
            bottom: -200px;
            right: -150px;
        }
        
        .orb-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ff1493 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .band-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 1400px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .band-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
        }
        
        .character-hotspot {
            position: absolute;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .character-hotspot:hover .hover-glow {
            opacity: 1;
        }
        
        .hover-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(57, 255, 20, 0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        
        .hover-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        
        .character-hotspot:hover .hover-image {
            opacity: 1;
        }
        
        .hover-text {
            position: absolute;
            top: 0px;
            left: 40%;
            transform: translateX(-50%);
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 20;
            letter-spacing: 2px;
        }
        
        .character-hotspot:hover .hover-text {
            opacity: 1;
            animation: neonPulse 1.5s ease-in-out infinite alternate;
        }
        
        /* 吉他手 - 橙色 */
        .hover-text.guitarist {
            color: #ff6b35;
            text-shadow: 
                0 0 5px #ff6b35,
                0 0 10px #ff6b35,
                0 0 20px #ff6b35,
                0 0 40px #ff1493;
        }
        
        /* 贝斯手 - 蓝色 */
        .hover-text.bassist {
            color: #00d4ff;
            text-shadow: 
                0 0 5px #00d4ff,
                0 0 10px #00d4ff,
                0 0 20px #00d4ff,
                0 0 40px #0077ff;
        }
        
        /* 鼓手 - 绿色 */
        .hover-text.drummer {
            color: #00ff88;
            text-shadow: 
                0 0 5px #00ff88,
                0 0 10px #00ff88,
                0 0 20px #00ff88,
                0 0 40px #00ff44;
        }
        
        /* 歌手 - 紫色 */
        .hover-text.singer {
            color: #ff00ff;
            text-shadow: 
                0 0 5px #ff00ff,
                0 0 10px #ff00ff,
                0 0 20px #ff00ff,
                0 0 40px #8800ff;
        }
        
        @keyframes neonPulse {
            from {
                opacity: 0.8;
            }
            to {
                opacity: 1;
            }
        }
        
        .character-video-container {
            position: absolute;
            z-index: 50;
            display: none;
            pointer-events: none;
        }
        
        .character-video-container.active {
            display: block;
        }
        
        .character-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        
        /* 全局静音按钮 */
        .mute-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a0a2a 0%, #2a1a3a 100%);
            border: 2px solid #ff6b35;
            color: #ff6b35;
            font-size: 24px;
            cursor: pointer;
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
        }
        
        .mute-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 107, 53, 0.5);
        }
        
        .mute-btn.muted {
            border-color: #666;
            color: #666;
            box-shadow: 0 0 20px rgba(102, 102, 102, 0.3);
        }
        
        .modal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        
        .modal-container.active {
            display: flex;
        }
        
        .modal-content {
            position: relative;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            background: linear-gradient(135deg, #1a0a2a 0%, #0a0a0a 100%);
            border: 2px solid rgba(57, 255, 20, 0.3);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(57, 255, 20, 0.2), inset 0 0 30px rgba(255, 107, 53, 0.05);
        }
        
        .modal-header {
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, #1a0a2a 0%, transparent 100%);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid rgba(255, 107, 53, 0.3);
        }
        
        .modal-header h2 {
            margin: 0;
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            color: #39ff14;
            text-shadow: 0 0 10px #39ff14;
        }
        
        .close-btn {
            width: 48px;
            height: 48px;
            background: rgba(255, 107, 53, 0.1);
            border: 2px solid rgba(255, 107, 53, 0.4);
            border-radius: 50%;
            color: #ff6b35;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', monospace;
        }
        
        .close-btn:hover {
            background: rgba(255, 107, 53, 0.3);
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
            transform: scale(1.1);
        }
        
        .modal-body {
            padding: 40px;
            max-height: calc(90vh - 150px);
            overflow-y: auto;
        }
        
        .modal-body::-webkit-scrollbar {
            width: 8px;
        }
        
        .modal-body::-webkit-scrollbar-track {
            background: rgba(57, 255, 20, 0.05);
        }
        
        .modal-body::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff6b35 0%, #39ff14 100%);
            border-radius: 4px;
        }
        
        .modal-placeholder {
            padding: 40px 0;
            text-align: center;
        }
        
        .modal-placeholder p {
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            color: #ff6b35;
            opacity: 0.8;
        }
        
        .section-title {
            font-family: 'Orbitron', monospace;
            color: #ff6b35;
            font-size: 24px;
            margin-bottom: 24px;
            border-bottom: 2px solid #ff6b35;
            padding-bottom: 8px;
            text-shadow: 0 0 10px #ff6b35;
        }
        
        .skill-card, .project-card, .info-card {
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid rgba(255, 107, 53, 0.4);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }
        
        .skill-card:hover, .project-card:hover, .info-card:hover {
            background: rgba(255, 107, 53, 0.15);
            border-color: rgba(255, 107, 53, 0.6);
            transform: translateX(5px);
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.2);
        }
        
        .timeline-container {
            position: relative;
            padding-left: 30px;
        }
        
        .timeline-container::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, #ff6b35 0%, #39ff14 100%);
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.3);
        }
        
        .timeline-item {
            position: relative;
            margin-bottom: 32px;
        }
        
        .timeline-dot {
            position: absolute;
            left: -26px;
            top: 4px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b35 0%, #39ff14 100%);
            box-shadow: 0 0 15px rgba(255, 107, 53, 0.5);
            border: 3px solid #1a0a2a;
        }
        
        .timeline-content {
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid rgba(255, 107, 53, 0.4);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        .timeline-content:hover {
            background: rgba(255, 107, 53, 0.15);
            border-color: rgba(255, 107, 53, 0.6);
            transform: translateX(5px);
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.2);
        }
        
        .timeline-date {
            font-family: 'Orbitron', monospace;
            color: #39ff14;
            font-size: 14px;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.3);
            margin-bottom: 8px;
        }
        
        .timeline-company {
            font-family: 'Orbitron', monospace;
            color: #ff6b35;
            font-size: 18px;
            margin-bottom: 4px;
            text-shadow: 0 0 5px rgba(255, 107, 53, 0.3);
        }
        
        .timeline-position {
            color: #8ed1fc;
            font-style: italic;
            margin-bottom: 12px;
        }
        
        .timeline-desc {
            color: #e0e0e0;
            line-height: 1.8;
            margin-bottom: 8px;
        }
        
        .timeline-highlight {
            background: rgba(255, 107, 53, 0.2);
            padding: 10px;
            border-radius: 5px;
            color: #ff6b35;
            font-weight: bold;
            line-height: 1.8;
        }
        
        .skill-card h4, .project-card h4, .info-card h4 {
            font-family: 'Orbitron', monospace;
            color: #ff6b35;
            margin-bottom: 12px;
            font-size: 18px;
            text-shadow: 0 0 5px #ff6b35;
        }
        
        .skill-card p, .project-desc, .info-card p {
            font-family: 'Rajdhani', sans-serif;
            color: #e0e0e0;
            line-height: 1.8;
            font-size: 16px;
        }
        
        .project-detail {
            margin-top: 16px;
            padding-left: 16px;
            border-left: 2px solid #ff6b35;
        }
        
        .project-detail h5 {
            font-family: 'Orbitron', monospace;
            color: #8ed1fc;
            margin-bottom: 8px;
            font-size: 16px;
            text-shadow: 0 0 5px #8ed1fc;
        }
        
        .project-detail ul {
            list-style: none;
            padding-left: 0;
        }
        
        .project-detail li {
            font-family: 'Rajdhani', sans-serif;
            color: #c0c0c0;
            padding: 6px 0;
            padding-left: 20px;
            position: relative;
        }
        
        .project-detail li:before {
            content: '▸';
            position: absolute;
            left: 0;
            color: #ff6b35;
        }
        
        .project-highlight {
            background: rgba(142, 209, 252, 0.1);
            border-left: 3px solid #8ed1fc;
            padding: 16px;
            margin-top: 16px;
            border-radius: 5px;
            color: #e0e0e0;
            line-height: 1.8;
            font-family: 'Rajdhani', sans-serif;
        }
        
        .company {
            color: #8ed1fc;
            font-weight: bold;
            margin-bottom: 4px !important;
        }
        
        .position {
            color: #ff6b35;
            font-style: italic;
            margin-bottom: 8px !important;
        }
        
        .highlight {
            background: rgba(255, 107, 53, 0.2);
            padding: 8px;
            border-radius: 5px;
            margin-top: 8px;
            color: #ff6b35 !important;
            font-weight: bold;
        }
        
        .info-card ul {
            list-style: none;
            padding-left: 0;
        }
        
        .info-card li {
            font-family: 'Rajdhani', sans-serif;
            color: #c0c0c0;
            padding: 6px 0;
            padding-left: 20px;
            position: relative;
        }
        
        .info-card li:before {
            content: '▸';
            position: absolute;
            left: 0;
            color: #ff6b35;
        }
        
        .info-card a {
            color: #8ed1fc;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .info-card a:hover {
            color: #ff6b35;
            text-decoration: underline;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }
        
        .info-item {
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            padding: 8px 12px;
            background: rgba(255, 107, 53, 0.05);
            border-radius: 6px;
            border-left: 3px solid rgba(57, 255, 20, 0.5);
        }
        
        .education-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(255, 107, 53, 0.05);
            border-radius: 8px;
        }
        
        .education-school {
            font-family: 'Orbitron', monospace;
            color: #ff6b35;
            font-size: 16px;
            text-shadow: 0 0 5px rgba(255, 107, 53, 0.3);
        }
        
        .education-major {
            font-family: 'Rajdhani', sans-serif;
            color: #8ed1fc;
            font-style: italic;
            font-size: 16px;
        }
        
        .education-time {
            font-family: 'Orbitron', monospace;
            color: #39ff14;
            font-size: 14px;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.3);
        }
        
        .faq-item {
            margin-bottom: 20px;
        }
        
        .faq-item h5 {
            color: #ff6b35;
            font-family: 'Orbitron', monospace;
            margin-bottom: 12px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .faq-item h5::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #ff6b35 0%, #39ff14 100%);
            border-radius: 2px;
        }
        
        .faq-answer {
            color: #e0e0e0;
            line-height: 1.8;
            margin-bottom: 12px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
        }
        
        .faq-company {
            color: #39ff14;
            font-family: 'Orbitron', monospace;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.3);
            font-weight: bold;
        }
        
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .skill-tag {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.15) 0%, rgba(57, 255, 20, 0.1) 100%);
            border: 1px solid rgba(255, 107, 53, 0.4);
            color: #ff6b35;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            text-shadow: 0 0 8px rgba(255, 107, 53, 0.3);
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.1);
        }
        
        .skill-tag:hover {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.25) 0%, rgba(57, 255, 20, 0.15) 100%);
            border-color: rgba(255, 107, 53, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
        }
        
        .tabs-container {
            margin-bottom: 20px;
        }
        
        .tabs-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 107, 53, 0.3);
            padding-bottom: 10px;
            position: relative;
        }
        
        .tab-title {
            flex: 1;
            text-align: center;
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            color: #ff6b35;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 10px;
        }
        
        .tab-title:hover {
            color: #39ff14;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.3);
        }
        
        .tab-title.active {
            color: #39ff14;
            text-shadow: 0 0 12px rgba(57, 255, 20, 0.5);
            font-size: 20px;
        }
        
        .tab-divider {
            width: 2px;
            height: 30px;
            background: linear-gradient(180deg, rgba(255, 107, 53, 0.8) 0%, rgba(57, 255, 20, 0.8) 100%);
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.3);
        }
        
        .tab-panel {
            display: none;
        }
        
        .tab-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .neon-border {
            position: absolute;
            top: 5%;
            left: 5%;
            right: 5%;
            bottom: 5%;
            border: 2px solid rgba(255, 107, 53, 0.2);
            pointer-events: none;
            opacity: 0.6;
        }
        
        .neon-border-2 {
            position: absolute;
            top: 6%;
            left: 6%;
            right: 6%;
            bottom: 6%;
            border: 1px solid rgba(57, 255, 20, 0.15);
            pointer-events: none;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="cyber-bg" id="homeContainer">
        <div class="glow-orb orb-1" id="orb1"></div>
        <div class="glow-orb orb-2" id="orb2"></div>
        <div class="glow-orb orb-3" id="orb3"></div>
        
        <div class="matte-overlay"></div>
        <div class="scanline"></div>
        <div class="noise"></div>
        
        <div class="neon-border"></div>
        <div class="neon-border-2"></div>
        
        <!-- 全局静音按钮 -->
        <button class="mute-btn" id="muteBtn">🔊</button>
        
        <!-- 音频元素 -->
        <audio id="guitaristAudio" src="./public/music/guitar_sound.mp3" preload="auto"></audio>
        <audio id="bassistAudio" src="./public/music/bass_sound.mp3" preload="auto"></audio>
        <audio id="drummerAudio" src="./public/music/drummer_sound.mp3" preload="auto"></audio>
        <audio id="singerAudio" src="./public/music/singer_sound.mp3" preload="auto"></audio>
        
        <div class="band-container">
            <img src="./public/image/home_main_band.png" alt="Rock Band" class="band-image" id="bandImage">
            
            <!-- 4个角色热区 - 这些坐标需要根据实际图片调整 -->
            <!-- 吉他手 (左1) -->
            <div class="character-hotspot" 
                 id="guitarist" 
                 data-character="guitarist"
                 style="top: 9%; left: 8%; width: 31%; height: 88%;">
                <div class="hover-text guitarist" style="top: 0px; left: 40%; transform: translateX(-50%);">个人简介</div>

                                <span class="faq-company">肯菲裕润：</span>个人完成数据中台1.0版本，采取专业的中间层数据映射保证数据及时性与数据库稳定，老板却要数据纯黑盒的实现形式，我带着技术与老板多次沟通无果，故辞职。
                            </p>
                        </div>
                        <div class="faq-item">
                            <h5>问题2：现在在看什么样的机会？</h5>
                            <p class="faq-answer">
                                目前最期望的是能找到和ai相关的产品岗位，不限于agent定制开发、行业+ai、ai工具平台等多种形式；另也接受电商等行业SaaS公司的岗位，毕竟SaaS的用户数据本身就是未来向AI转型的重要资产。
                            </p>
                        </div>
                    </div>
                `,
                videoContainer: 'singerVideoContainer',
                videoElement: 'singerVideo'
            }
        };
        
        // 初始化动画
        function initAnimations() {
            gsap.to('#orb1', {
                x: 40, y: -40, scale: 1.15, duration: 10, repeat: -1, yoyo: true, ease: "sine.inOut"
            });
            gsap.to('#orb2', {
                x: -30, y: 30, scale: 0.9, duration: 10, repeat: -1, yoyo: true, ease: "sine.inOut", delay: 3
            });
            gsap.to('#orb3', {
                x: 30, y: 40, scale: 1.1, duration: 10, repeat: -1, yoyo: true, ease: "sine.inOut", delay: 5
            });
            
            gsap.fromTo('#bandImage', 
                { opacity: 0, scale: 0.9 },
                { opacity: 1, scale: 1, duration: 1, ease: "power2.out" }
            );
        }
        
        // 播放角色视频
        function playCharacterVideo(characterId) {
            // 先清理之前的所有状态
            if (currentVideo) {
                currentVideo.pause();
                currentVideo = null;
            }
            
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio.onended = null;
                currentAudio = null;
            }
            
            document.querySelectorAll('.character-video-container').forEach(vc => {
                vc.classList.remove('active');
            });
            
            // 设置新的状态
            currentCharacter = characterId;
            const config = characterConfig[characterId];
            const videoContainer = document.getElementById(config.videoContainer);
            const video = document.getElementById(config.videoElement);
            const audio = document.getElementById(config.audio);
            const characterHotspot = document.getElementById(characterId);
            const hoverImage = characterHotspot.querySelector('.hover-image');
            
            // 隐藏角色图片
            hoverImage.style.opacity = '0';
            
            videoContainer.style.position = 'absolute';
            videoContainer.style.top = '0';
            videoContainer.style.left = '0';
            videoContainer.style.width = '100%';
            videoContainer.style.height = '100%';
            videoContainer.style.pointerEvents = 'none';
            
            video.src = config.video;
            videoContainer.classList.add('active');
            currentVideo = video;
            currentAudio = audio;
            
            // 确保视频始终muted
            video.muted = true;
            
            // 设置音频的静音状态
            audio.muted = isMuted;
            
            // 清理之前的事件监听器（再次确保
            audio.onended = null;
            
            // 同步播放视频和音频
            video.play().catch(e => {
                console.log('视频播放需要用户交互');
                showModal(characterId);
            });
            
            audio.currentTime = 0;
            audio.play().catch(e => {
                console.log('音频播放需要用户交互');
            });
            
            // 音频结束后显示弹窗（确保音频播完）
            audio.onended = () => {
                showModal(characterId);
            };
        }
        
        // 显示弹窗
        function showModal(characterId) {
            const config = characterConfig[characterId];
            const modalContainer = document.getElementById('modalContainer');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const characterHotspot = document.getElementById(characterId);
            const hoverImage = characterHotspot.querySelector('.hover-image');
            
            if (currentVideo) {
                currentVideo.pause();
                currentVideo = null;
            }
            
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            
            document.querySelectorAll('.character-video-container').forEach(vc => {
                vc.classList.remove('active');
            });
            
            // 恢复角色图片显示
            hoverImage.style.opacity = '';
            
            modalTitle.textContent = config.title;
            modalBody.innerHTML = config.content;
            modalContainer.classList.add('active');
            
            gsap.fromTo('.modal-content', 
                { opacity: 0, scale: 0.8, y: 30 },
                { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }
            );
            
            // 初始化tab切换
            initTabs();
        }
        
        // 关闭弹窗
        function closeModal() {
            const modalContainer = document.getElementById('modalContainer');
            
            // 先清理音频和视频
            if (currentVideo) {
                currentVideo.pause();
                currentVideo = null;
            }
            
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            
            // 然后关闭弹窗和清理其他状态
            modalContainer.classList.remove('active');
            currentCharacter = null;
        }
        
        // 切换全局静音
        function toggleMute() {
            isMuted = !isMuted;
            const muteBtn = document.getElementById('muteBtn');
            
            if (isMuted) {
                muteBtn.textContent = '🔇';
                muteBtn.classList.add('muted');
                // 静音所有音频
                document.querySelectorAll('audio').forEach(audio => {
                    audio.muted = true;
                });
            } else {
                muteBtn.textContent = '🔊';
                muteBtn.classList.remove('muted');
                // 只有当前播放的音频取消静音
                if (currentAudio) {
                    currentAudio.muted = false;
                }
            }
        }
        
        // 初始化tab切换
        function initTabs() {
            const tabTitles = document.querySelectorAll('.tab-title');
            const tabPanels = document.querySelectorAll('.tab-panel');
            
            tabTitles.forEach(title => {
                title.addEventListener('click', function() {
                    const tabId = this.dataset.tab;
                    
                    // 移除所有active类
                    tabTitles.forEach(t => t.classList.remove('active'));
                    tabPanels.forEach(p => p.classList.remove('active'));
                    
                    // 添加当前active类
                    this.classList.add('active');
                    document.getElementById(tabId).classList.add('active');
                });
            });
        }
        
        // 绑定事件
        document.querySelectorAll('.character-hotspot').forEach(hotspot => {
            hotspot.addEventListener('click', function() {
                const characterId = this.dataset.character;
                playCharacterVideo(characterId);
            });
        });
        
        document.getElementById('closeModal').addEventListener('click', closeModal);
        document.getElementById('muteBtn').addEventListener('click', toggleMute);
        
        // 点击弹窗背景关闭
        document.getElementById('modalContainer').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        

        
        // 键盘ESC关闭弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
        
        window.addEventListener('load', initAnimations);
    </script>
</body>
</html>
